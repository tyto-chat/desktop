name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            platform: mac
            targets: --mac
          - os: windows-latest
            platform: win
            targets: --win
          - os: ubuntu-latest
            platform: linux
            targets: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, format
        run: npm run lint && npm run typecheck && npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build the client at client-ref
        run: npm run build:client

      - name: Build the shell
        run: npm run build

      - name: Headless smoke launch
        if: matrix.platform == 'linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          TYTO_ALLOW_INSECURE_KEYCHAIN=1 npx electron scripts/smoke-main.js

      - name: Decide whether this build is signed
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          SIGNED=true
          if [ "$PLATFORM" = "mac" ] && [ -z "$CSC_LINK" ]; then SIGNED=false; fi
          if [ "$PLATFORM" = "win" ] && [ -z "$WIN_CSC_LINK" ]; then SIGNED=false; fi
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
          if [ "$SIGNED" = "false" ]; then
            mkdir -p dist
            touch "dist/UNSIGNED-$PLATFORM"
            echo "::warning::No signing certificate for $PLATFORM. This installer is UNSIGNED."
          fi

      - name: Package (signed)
        if: steps.signing.outputs.signed == 'true'
        run: npx electron-builder ${{ matrix.targets }} --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package (unsigned)
        if: steps.signing.outputs.signed != 'true'
        run: npx electron-builder ${{ matrix.targets }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
            dist/UNSIGNED-*

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: release

      - name: Create one draft release with every installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          UNSIGNED_MAC=false
          UNSIGNED_WIN=false
          [ -e release/UNSIGNED-mac ] && UNSIGNED_MAC=true
          [ -e release/UNSIGNED-win ] && UNSIGNED_WIN=true
          rm -f release/UNSIGNED-*
          FLAGS=(--draft --verify-tag --title "$GITHUB_REF_NAME")
          NOTES="Draft created by the release workflow. Review, then publish."
          if [ "$UNSIGNED_MAC" = "true" ] || [ "$UNSIGNED_WIN" = "true" ]; then
            FLAGS+=(--prerelease)
            NOTES="$NOTES"$'\n\n'"WARNING: this release contains UNSIGNED installers"
            [ "$UNSIGNED_MAC" = "true" ] && NOTES="$NOTES (macOS)"
            [ "$UNSIGNED_WIN" = "true" ] && NOTES="$NOTES (Windows)"
            NOTES="$NOTES. Unsigned macOS builds cannot auto-update. Unsigned Windows updates are not signature-checked. Do not publish as a regular release."
          fi
          gh release create "$GITHUB_REF_NAME" "${FLAGS[@]}" --notes "$NOTES" release/*
