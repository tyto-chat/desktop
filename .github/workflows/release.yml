name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            platform: mac
            targets: --mac
          - os: windows-latest
            platform: win
            targets: --win
          - os: ubuntu-latest
            platform: linux
            targets: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build the client at client-ref
        run: npm run build:client

      - name: Build the shell
        run: npm run build

      - name: Smoke launch on a virtual display
        if: matrix.platform == 'linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          TYTO_ALLOW_INSECURE_KEYCHAIN=1 xvfb-run --auto-servernum npx electron scripts/smoke-main.js

      - name: Decide whether this build is signed
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          SIGNED=true
          if [ "$PLATFORM" = "mac" ] && [ -z "$CSC_LINK" ]; then SIGNED=false; fi
          if [ "$PLATFORM" = "win" ] && { [ -z "$SIGNPATH_API_TOKEN" ] || [ -z "$SIGNPATH_ORGANIZATION_ID" ]; }; then SIGNED=false; fi
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
          if [ "$SIGNED" = "false" ]; then
            mkdir -p dist
            touch "dist/UNSIGNED-$PLATFORM"
            echo "::warning::No signing credentials for $PLATFORM. This installer is UNSIGNED."
          fi

      - name: Package macOS (signed)
        if: matrix.platform == 'mac' && steps.signing.outputs.signed == 'true'
        run: npx electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package the Windows app, unsigned
        if: matrix.platform == 'win' && steps.signing.outputs.signed == 'true'
        run: |
          npx electron-builder --win --dir --publish never
          mkdir -p dist/signing/app/resources
          cp dist/win-unpacked/Tyto.exe dist/signing/app/
          if [ -e dist/win-unpacked/resources/elevate.exe ]; then
            cp dist/win-unpacked/resources/elevate.exe dist/signing/app/resources/
          fi
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload the Windows app for signing
        if: matrix.platform == 'win' && steps.signing.outputs.signed == 'true'
        id: upload-app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signing-windows-app
          path: dist/signing/app
          if-no-files-found: error
          retention-days: 1

      - name: Sign the Windows app (waits for approval in SignPath)
        if: matrix.platform == 'win' && steps.signing.outputs.signed == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: tyto-desktop
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signing/app-signed

      - name: Package the Windows installer from the signed app
        if: matrix.platform == 'win' && steps.signing.outputs.signed == 'true'
        run: |
          cp -R dist/signing/app-signed/. dist/win-unpacked/
          pwsh scripts/assert-signed.ps1 dist/win-unpacked/Tyto.exe
          npx electron-builder --win --prepackaged dist/win-unpacked --publish never
          pwsh scripts/assert-signed.ps1 dist/win-unpacked/Tyto.exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload the Windows installer for signing
        if: matrix.platform == 'win' && steps.signing.outputs.signed == 'true'
        id: upload-installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signing-windows-installer
          path: dist/tyto-*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the Windows installer (waits for approval in SignPath)
        if: matrix.platform == 'win' && steps.signing.outputs.signed == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: tyto-desktop
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signing/installer-signed

      - name: Put the signed installer in place and refresh the update feed
        if: matrix.platform == 'win' && steps.signing.outputs.signed == 'true'
        run: |
          cp dist/signing/installer-signed/*.exe dist/
          pwsh scripts/assert-signed.ps1 dist/tyto-*.exe
          node scripts/refresh-update-feed.js dist/tyto-*.exe
          rm -rf dist/signing

      - name: Package (unsigned)
        if: matrix.platform == 'linux' || steps.signing.outputs.signed != 'true'
        run: npx electron-builder ${{ matrix.targets }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
            dist/UNSIGNED-*

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: installers-*
          merge-multiple: true
          path: release

      - name: Create one draft release with every installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          UNSIGNED_MAC=false
          UNSIGNED_WIN=false
          [ -e release/UNSIGNED-mac ] && UNSIGNED_MAC=true
          [ -e release/UNSIGNED-win ] && UNSIGNED_WIN=true
          rm -f release/UNSIGNED-*
          FLAGS=(--draft --verify-tag --title "$GITHUB_REF_NAME")
          NOTES="Draft created by the release workflow. Review, then publish."
          if [ "$UNSIGNED_MAC" = "true" ] || [ "$UNSIGNED_WIN" = "true" ]; then
            FLAGS+=(--prerelease)
            NOTES="$NOTES"$'\n\n'"WARNING: this release contains UNSIGNED installers"
            [ "$UNSIGNED_MAC" = "true" ] && NOTES="$NOTES (macOS)"
            [ "$UNSIGNED_WIN" = "true" ] && NOTES="$NOTES (Windows)"
            NOTES="$NOTES. Unsigned macOS builds cannot auto-update. Unsigned Windows updates are not signature-checked. Do not publish as a regular release."
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber release/*
            if [ "$UNSIGNED_MAC" = "true" ] || [ "$UNSIGNED_WIN" = "true" ]; then
              gh release edit "$GITHUB_REF_NAME" --prerelease
            fi
          else
            gh release create "$GITHUB_REF_NAME" "${FLAGS[@]}" --notes "$NOTES" release/*
          fi
