[package]
name = "tyto-mls-engine"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mls-rs = { version = "=0.56.0", default-features = false, features = ["std", "rfc_compliant", "tree_index", "last_resort_key_package_ext"] }
mls-rs-core = "=0.27.0"
mls-rs-codec = "=0.7.0"
mls-rs-crypto-rustcrypto = "=0.22.1"
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"
zeroize = "1"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
lto = true
opt-level = "s"
